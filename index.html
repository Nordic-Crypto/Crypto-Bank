<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0B1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NordicCrypto">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="logo.png">
<title>NordicCrypto</title>
<style>
:root{--pri:#00E5FF;--pri2:#8B5CF6;--acc:#10B981;--bg:#0B1220;--pan:#111827;--pan2:#1A1F2E;--txt:#F8FAFC;--mut:#94A3B8;--bd:rgba(255,255,255,.08);--bd2:rgba(255,255,255,.14);--ok:#10B981;--bad:#EF4444;--warn:#F59E0B;--nc3-line:rgba(255,255,255,.075);--nc3-green:#36e2a3;--shadow-md:0 12px 30px rgba(0,0,0,.35);--shadow-lg:0 24px 60px rgba(0,0,0,.45)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);display:flex;overflow:hidden;color-scheme:dark;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(900px 500px at 15% -10%,rgba(0,212,255,.10),transparent 60%),radial-gradient(800px 500px at 100% 110%,rgba(124,58,237,.12),transparent 60%)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:rgba(255,255,255,.02)}
::-webkit-scrollbar-thumb{background:rgba(71,220,255,.25);border-radius:4px}
.side{width:238px;background:rgba(7,10,18,.88);border-right:1px solid var(--nc3-line);display:flex;flex-direction:column;padding:18px 14px;position:relative;z-index:2}
.brand{font-size:1.3rem;font-weight:800;margin-bottom:42px;display:flex;align-items:center;gap:11px}
.blogo{width:34px;height:34px;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,212,255,.25)}
.blogo img{width:100%;height:100%;object-fit:cover;display:block}
.brand span{color:var(--pri)}
.menu{list-style:none;flex:1;display:flex;flex-direction:column;gap:4px}
.mi{padding:12px 14px;border-radius:12px;cursor:pointer;color:var(--mut);font-weight:500;font-size:.92rem;transition:background .2s,color .2s;display:flex;align-items:center;gap:13px;position:relative;user-select:none}
.mi svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.mi:hover{background:rgba(255,255,255,.045);color:var(--txt)}
.mi.on{background:linear-gradient(100deg,rgba(71,220,255,.13),rgba(71,220,255,.025));color:var(--pri);box-shadow:inset 0 0 0 1px rgba(71,220,255,.11)}
.mi.on::before{content:'';position:absolute;left:-14px;top:50%;transform:translateY(-50%);width:3px;height:22px;background:var(--pri);border-radius:0 3px 3px 0}
.umi{border-top:1px solid var(--bd);padding-top:18px;display:flex;align-items:center;gap:12px}
.av{width:42px;height:42px;background:linear-gradient(135deg,var(--pri),var(--pri2));border-radius:12px;display:flex;justify-content:center;align-items:center;font-weight:700;font-size:.9rem;color:#05070a;flex-shrink:0}
.umi h4{font-size:.86rem;font-weight:600}
.umi p{font-size:.72rem;color:var(--ok);margin-top:2px}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;z-index:1}
.top{height:70px;background:rgba(7,10,18,.88);border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;padding:0 30px;flex-shrink:0;gap:20px;position:relative;z-index:100}
.top-search{flex:1;max-width:480px;display:flex;align-items:center;gap:10px;padding:10px 16px;background:rgba(255,255,255,.028);border:1px solid rgba(255,255,255,.07);border-radius:14px}
.top-search svg{width:18px;height:18px;stroke:var(--mut);fill:none;stroke-width:2;flex-shrink:0}
.top-search input{flex:1;background:transparent;border:none;outline:none;color:var(--txt);font-size:.92rem;font-family:inherit}
.top-search input::placeholder{color:var(--mut)}
.top-icon{width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.04);border:1px solid var(--bd2);border-radius:10px;color:var(--txt);cursor:pointer;transition:.2s}
.top-icon:hover{background:rgba(255,255,255,.08);border-color:var(--pri)}
.top-icon svg{width:18px;height:18px;stroke:#7dd3fc;fill:none;stroke-width:2}
.settings-btn{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid var(--bd2);cursor:pointer;transition:.2s}
.settings-btn:hover{background:rgba(255,255,255,.08);border-color:var(--pri)}
.settings-btn svg{width:18px;height:18px;stroke:var(--txt);fill:none;stroke-width:1.9}
.st{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--mut);background:rgba(0,224,138,.07);border:1px solid rgba(0,224,138,.18);padding:7px 14px;border-radius:999px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
.body{flex:1;padding:26px 30px 48px;overflow-y:auto;overflow-x:hidden;min-height:0;max-height:100%;-webkit-overflow-scrolling:touch}
.pg{display:none}
.pg.on{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.panel{background:var(--pan);border:1px solid var(--bd);border-radius:16px;padding:24px;box-shadow:var(--shadow-md)}
.btn{padding:12px 20px;border-radius:10px;border:none;font-weight:600;font-size:.9rem;cursor:pointer;transition:.2s;font-family:inherit;display:inline-flex;align-items:center;gap:8px}
.btn:active{transform:scale(.97)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.b1{background:linear-gradient(135deg,var(--pri),#0090c9);color:#04121a;box-shadow:0 10px 24px -10px rgba(0,212,255,.8)}
.b1:hover{filter:brightness(1.1)}
.b2{background:rgba(255,255,255,.03);border:1px solid var(--bd2);color:var(--txt)}
.b2:hover{background:rgba(255,255,255,.07)}
.b3{background:rgba(255,84,112,.1);border:1px solid rgba(255,84,112,.3);color:#ff5470}
.sh{margin-bottom:14px}
.sh h2{font-size:1.4rem;font-weight:700}
.sh p{color:var(--mut);font-size:.88rem;margin-top:5px}
.fg{margin-bottom:18px}
.fg label{display:block;margin-bottom:8px;color:var(--mut);font-size:.82rem;font-weight:500}
.fc{width:100%;padding:13px 15px;background:rgba(7,10,15,.7);border:1px solid var(--bd2);border-radius:10px;color:var(--txt);font-size:.95rem;font-family:inherit;transition:.2s}
.fc:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 4px rgba(0,212,255,.12)}
.fc::placeholder{color:#4b5769}
.fr{display:flex;gap:14px}
select.fc{background:#0f1420;color:#e8f4ff;color-scheme:dark}
select.fc option{background:#0f1420;color:#e8f4ff}
.toast{position:fixed;top:22px;right:22px;background:var(--pan2);border:1px solid var(--bd2);border-left:4px solid var(--ok);padding:15px 22px;border-radius:10px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:11px;transform:translateX(130%);transition:transform .35s cubic-bezier(.34,1.56,.64,1);z-index:2000;font-size:.9rem;max-width:380px}
.toast.on{transform:translateX(0)}
.toast svg{width:18px;height:18px;stroke:var(--ok);fill:none;stroke-width:2.5}
.hidden{display:none}
.mask{position:fixed;inset:0;background:rgba(3,6,11,.75);display:none;justify-content:center;align-items:center;z-index:7000;animation:maskIn .2s ease}
.mask.on{display:flex}
@keyframes maskIn{from{opacity:0}to{opacity:1}}
.box{background:linear-gradient(180deg,var(--pan2),#0f151e);padding:30px;border-radius:16px;width:440px;max-width:calc(100vw - 40px);border:1px solid var(--bd2);box-shadow:var(--shadow-lg)}
.box h2{margin-bottom:6px;font-size:1.25rem}
.box .d{color:var(--mut);font-size:.86rem;margin-bottom:22px}
.mact{display:flex;gap:10px;margin-top:24px}
.tbl{background:var(--pan);border:1px solid var(--bd);border-radius:16px;overflow:hidden}
.tbl table{width:100%;border-collapse:collapse}
.tbl th{text-align:left;color:var(--mut);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;padding:16px 22px;border-bottom:1px solid var(--bd);font-weight:600}
.tbl td{padding:16px 22px;border-bottom:1px solid rgba(255,255,255,.04);font-size:.9rem}
.empty{text-align:center;padding:60px 20px;color:var(--mut)}
.badge{padding:4px 10px;border-radius:6px;font-size:.72rem;font-weight:600;display:inline-block}
.badge.ok{background:rgba(0,224,138,.14);color:var(--ok)}
.badge.pend{background:rgba(255,176,32,.14);color:var(--warn)}
.badge.proc{background:rgba(0,212,255,.14);color:var(--pri)}
.badge.fail{background:rgba(255,84,112,.14);color:var(--bad)}
.login-screen{position:fixed;inset:0;background:radial-gradient(900px 500px at 30% 10%,rgba(0,212,255,.12),transparent 60%),radial-gradient(800px 500px at 70% 90%,rgba(124,58,237,.14),transparent 60%),var(--bg);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:5000;padding:40px 20px;transition:opacity .4s ease}
.login-screen.hidden{opacity:0;pointer-events:none}
.login-box{background:linear-gradient(180deg,rgba(22,30,42,.95),rgba(13,18,25,.95));border:1px solid var(--bd2);border-radius:20px;padding:42px 38px;width:100%;max-width:420px;box-shadow:var(--shadow-lg)}
.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:28px;font-size:1.3rem;font-weight:800}
.login-logo .blogo{width:42px;height:42px}
.login-logo-text span{color:var(--pri)}
.login-title{font-size:1.6rem;font-weight:800;margin-bottom:6px}
.login-sub{color:var(--mut);font-size:.9rem;margin-bottom:28px}
.login-error{background:rgba(255,84,112,.1);border:1px solid rgba(255,84,112,.3);color:#ff5470;padding:12px 16px;border-radius:10px;font-size:.85rem;margin-bottom:16px;text-align:center}
.login-btn{width:100%;justify-content:center;padding:15px;font-size:1rem;margin-top:8px}
.login-btn:disabled{opacity:.6;cursor:not-allowed}
.login-hint{text-align:center;margin-top:20px;font-size:.82rem;color:var(--mut)}
.login-hint a{color:var(--pri);text-decoration:none;font-weight:600}
.login-loading{text-align:center;padding:20px 0}
.login-spinner{width:32px;height:32px;border:3px solid rgba(0,212,255,.2);border-top-color:var(--pri);border-radius:50%;margin:0 auto 14px;animation:loginSpin 1s linear infinite}
@keyframes loginSpin{to{transform:rotate(360deg)}}
.login-footer{margin-top:30px;font-size:.78rem;color:var(--mut);text-align:center;opacity:.7}
.login-divider{display:flex;align-items:center;gap:12px;margin:22px 0;color:var(--mut);font-size:.78rem;text-transform:uppercase;letter-spacing:.1em}
.login-divider::before,.login-divider::after{content:'';flex:1;height:1px;background:var(--bd)}
.login-btn-outline{width:100%;justify-content:center;padding:14px;font-size:.95rem}
.pass-wrap{position:relative}
.pass-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:transparent;border:none;color:var(--mut);cursor:pointer;font-size:1rem;padding:4px}
.notif-bell{position:relative;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);cursor:pointer;transition:.25s}
.notif-bell:hover{background:rgba(71,220,255,.08);border-color:rgba(71,220,255,.5)}
.notif-bell svg{width:18px;height:18px;stroke:#7dd3fc;fill:none;stroke-width:2}
.notif-badge{position:absolute;top:-4px;right:-4px;background:#ff5470;color:#fff;font-size:.68rem;font-weight:700;min-width:18px;height:18px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.notif-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.25s;z-index:1900}
.notif-overlay.on{opacity:1;pointer-events:auto}
.notif-panel{position:fixed;top:0;right:0;bottom:0;width:400px;max-width:100vw;background:linear-gradient(180deg,var(--pan2),#0a0f16);border-left:1px solid var(--bd2);transform:translateX(100%);transition:transform .3s;z-index:1950;display:flex;flex-direction:column}
.notif-panel.on{transform:translateX(0)}
.notif-header{padding:20px 22px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.notif-title{font-size:1.15rem;font-weight:700;margin-bottom:3px}
.notif-sub{font-size:.8rem;color:var(--mut)}
.notif-close{width:34px;height:34px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid var(--bd);color:var(--txt);cursor:pointer;display:flex;align-items:center;justify-content:center}
.notif-list{flex:1;overflow-y:auto;padding:12px}
.notif-item{position:relative;display:flex;gap:14px;padding:14px 16px;background:rgba(255,255,255,.02);border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;cursor:pointer}
.notif-item.unread{background:rgba(0,212,255,.06);border-color:rgba(0,212,255,.25)}
.notif-icon{width:38px;height:38px;border-radius:10px;background:rgba(0,212,255,.1);display:flex;align-items:center;justify-content:center;font-size:1.15rem;flex-shrink:0}
.notif-body{flex:1;min-width:0}
.notif-text{font-size:.88rem;font-weight:600;margin-bottom:4px;line-height:1.3}
.notif-time{font-size:.75rem;color:var(--mut)}
.notif-empty{text-align:center;padding:60px 20px;color:var(--mut);font-size:.9rem}
@media (max-width:600px){.notif-panel{width:100vw}}
.settings-section{margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--bd)}
.settings-section:last-of-type{border-bottom:none;padding-bottom:0}
.settings-label{font-size:.72rem;color:var(--mut);letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin-bottom:12px}
.settings-row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:12px}
.settings-name{font-size:.92rem;font-weight:700;margin-bottom:3px}
.settings-email{font-size:.78rem;color:var(--mut);font-family:ui-monospace,monospace}
.settings-role{font-size:.72rem;padding:4px 10px;border-radius:6px;background:rgba(0,212,255,.12);color:var(--pri);font-weight:700;text-transform:uppercase;display:inline-block;margin-top:6px}
.settings-btn-row{width:100%;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:12px;cursor:pointer;font-family:inherit;color:var(--txt);font-size:.9rem;font-weight:600;transition:.2s;margin-bottom:8px}
.settings-btn-row:hover{background:rgba(0,212,255,.05);border-color:rgba(0,212,255,.3)}
.settings-btn-row.danger{color:#ff5470}
.inactivity-overlay{position:fixed;inset:0;background:rgba(3,6,11,.85);backdrop-filter:blur(12px);display:none;justify-content:center;align-items:center;z-index:6000;padding:20px}
.inactivity-overlay.on{display:flex}
.inactivity-box{background:linear-gradient(180deg,rgba(22,30,42,.98),rgba(13,18,25,.98));border:1px solid rgba(255,176,32,.3);border-radius:20px;padding:38px;width:100%;max-width:420px;text-align:center;box-shadow:var(--shadow-lg)}
.inactivity-icon{font-size:3rem;margin-bottom:16px}
.inactivity-box h2{font-size:1.4rem;font-weight:800;margin-bottom:10px}
.inactivity-box p{color:var(--mut);font-size:.9rem;margin-bottom:20px}
.inactivity-timer{font-family:ui-monospace,Menlo,monospace;font-size:3rem;font-weight:800;color:var(--warn);margin-bottom:24px}
.inactivity-actions{display:flex;gap:10px}
.inactivity-actions .btn{flex:1;justify-content:center;padding:14px}
.pay{background:radial-gradient(500px 200px at 100% 0%,rgba(0,212,255,.18),transparent 60%),linear-gradient(135deg,#1b2533 0%,#0a0e15 100%);border:1px solid rgba(255,255,255,.09);border-radius:20px;padding:26px;height:200px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 30px 60px -30px rgba(0,0,0,.9);position:relative;overflow:hidden;margin-bottom:24px;transition:.3s}
.pay-shine{position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(120deg,transparent 0%,transparent 30%,rgba(255,255,255,.15) 50%,transparent 70%,transparent 100%);transition:left .8s ease;pointer-events:none;z-index:3}
.pay:hover .pay-shine{left:100%}
.pay:hover{transform:perspective(1000px) rotateY(-4deg) rotateX(3deg) translateY(-4px)}
.pay.frozen{filter:grayscale(.7) brightness(.7)}
.pay.frozen::before{content:'FROZEN';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:900;letter-spacing:.3em;color:rgba(255,255,255,.2);z-index:5}
.ptop{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1}
.pb{font-weight:800;letter-spacing:.14em;font-size:.82rem;color:#fff}
.pt{font-size:.7rem;color:var(--mut);letter-spacing:.12em}
.chip-real{width:52px;height:40px;background:linear-gradient(135deg,#f5d67a 0%,#d4a017 40%,#a37c0c 100%);border-radius:7px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3);position:relative;overflow:hidden}
.chip-row{display:flex;align-items:center;gap:14px;position:relative;z-index:1;margin:4px 0}
.nfc-icon{width:26px;height:26px;stroke:currentColor;stroke-width:1.8;fill:none;opacity:.65;transform:rotate(90deg)}
.pn{font-family:ui-monospace,Menlo,monospace;font-size:1.42rem;letter-spacing:.16em;position:relative;z-index:1;color:#fff}
.pf{display:flex;justify-content:space-between;align-items:flex-end;position:relative;z-index:1;gap:12px}
.pl{font-size:.62rem;color:var(--mut);letter-spacing:.14em;margin-bottom:4px}
.pv{font-weight:600;font-size:.9rem;text-transform:uppercase;color:#fff}
.pv.m{font-family:ui-monospace,Menlo,monospace}
.card-network{display:flex;align-items:center;color:inherit;opacity:.9}
.card-network svg{width:56px;height:24px;display:block}
.pay.pay-large{height:240px;padding:22px;margin-bottom:0;max-width:360px;width:100%;background:radial-gradient(500px 250px at 100% 0%,rgba(139,92,246,.35),transparent 60%),radial-gradient(400px 250px at 0% 100%,rgba(95,76,255,.35),transparent 60%),linear-gradient(135deg,#1a1030 0%,#2a1750 50%,#3d1a45 100%);border:1px solid rgba(255,255,255,.12);box-shadow:0 30px 60px -20px rgba(95,76,255,.4),inset 0 1px 0 rgba(255,255,255,.15);overflow:hidden}
.pay.pay-large .pn{font-size:1.3rem;letter-spacing:.12em;white-space:nowrap}
.pay.design-cosmic{background:linear-gradient(135deg,#1a1a2e,#0f3460)}
.pay.design-purple{background:linear-gradient(135deg,#7c3aed,#a855f7)}
.pay.design-silver{background:linear-gradient(135deg,#c0c0c0,#808080)}
.pay.design-silver .pb,.pay.design-silver .pn,.pay.design-silver .pv,.pay.design-silver .pl{color:#18181b}
.pay.design-black{background:linear-gradient(135deg,#1a1a1a,#000)}
.pay.design-gold{background:linear-gradient(135deg,#d4af37,#b8860b)}
.pay.design-ocean{background:linear-gradient(135deg,#0891b2,#06b6d4)}
.pay.design-mountain{background:linear-gradient(135deg,#475569,#1e293b)}
.pay.design-aurora{background:linear-gradient(135deg,#10b981,#7c3aed)}
.pay.design-city{background:linear-gradient(135deg,#1e293b,#0f172a)}
.design-picker{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:8px}
.design-opt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;background:rgba(255,255,255,.03);border:2px solid var(--bd);border-radius:12px;cursor:pointer;font-family:inherit;color:var(--txt);font-size:.7rem;font-weight:600;transition:.2s}
.design-opt.on{border-color:var(--pri);background:rgba(0,212,255,.08)}
.design-preview{width:100%;height:34px;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.design-preview.cosmic{background:radial-gradient(100px 40px at 100% 0%,rgba(0,212,255,.5),transparent 60%),linear-gradient(135deg,#1b2533 0%,#0a0e15 100%)}
.design-preview.purple{background:radial-gradient(100px 40px at 100% 0%,rgba(236,72,153,.6),transparent 60%),linear-gradient(135deg,#4c1d95 0%,#831843 100%)}
.design-preview.silver{background:linear-gradient(135deg,#e4e4e7 0%,#a1a1aa 50%,#71717a 100%)}
.design-preview.black{background:linear-gradient(135deg,#27272a 0%,#09090b 100%)}
.design-preview.gold{background:radial-gradient(100px 40px at 100% 0%,rgba(255,237,160,.7),transparent 60%),linear-gradient(135deg,#b8860b 0%,#6b4e08 100%)}
.design-preview.ocean{background:linear-gradient(135deg,#0c4a6e 0%,#0369a1 100%)}
.design-preview.mountain{background:linear-gradient(135deg,#1e293b 0%,#1e1b4b 100%)}

<script>
document.addEventListener('DOMContentLoaded', function(){
  var greet = document.getElementById('nc3Greeting');
  if (greet){
    var hour = new Date().getHours();
    if (hour >= 5 && hour < 12) greet.textContent = 'Good morning';
    else if (hour >= 12 && hour < 18) greet.textContent = 'Good afternoon';
    else if (hour >= 18 && hour < 23) greet.textContent = 'Good evening';
    else greet.textContent = 'Good night';
  }
  var nameEl = document.getElementById('nc3HeroName');
  if (nameEl){
    var n = localStorage.getItem('user_name');
    if (n && n.trim() !== '' && n !== 'User' && n !== 'Admin'){
      nameEl.textContent = ' ' + n.split(' ')[0];
    }
  }
});
</script>
